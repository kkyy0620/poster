<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="box">
      <div class="poster">
        <div class="title-group">
          <div class="heading">
            <div class="top-line"></div>
            <div class="title">BEATLES</div>
          </div>
          <div class="photo-text">
            <img
              class="poster-image"
              src="./images/beatles.jpg"
              alt="비틀즈 사진"
            />
            <div class="text-area">
              <p class="country">
                LIVE ON STAGE <br />
                FIRST TIME ON CANADA
              </p>
              <div class="info-box">
                <p class="place">EMPIRE STADIUM</p>
                <p class="city">VANCOUVER, BRITISH COLUMIA</p>
              </div>
              <div class="featuring">
                <p class="also">ALSO FEATURING</p>
                <p class="guest">
                  THE RIGHTEOUS BROS. - THE EXCITERS <br />
                  JACKIE DESHANNON - BILL BLACK COMBO
                </p>
              </div>
            </div>
          </div>
        </div>
        <div class="date-group">
          <div class="bottom-line"></div>
          <div class="date">SAT. AUG. 22, 1924 8P.M.</div>
        </div>
      </div>
    </div>
  </body>
</html>
